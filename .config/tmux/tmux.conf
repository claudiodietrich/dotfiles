# Fix colors
set -g default-terminal "tmux-256color"
set-option -ga terminal-overrides ",*:Tc"

# Set Ctrl-Space as prefix
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Enable mouse support
set -g mouse on

# Address vim mode switching delay (http://superuser.com/a/252717/65504)
set -s escape-time 0

# Increase scrollback buffer size from 2000 to 50000 lines
set -g history-limit 50000

# Increase tmux messages display duration from 750ms to 4s
set -g display-time 4000

# Refresh 'status-left' and 'status-right' more often, from every 15s to 5s
set -g status-interval 5

# Start numbering windows and panes at 1 instead of 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Window navigation with Alt+H/L
bind -n M-H previous-window
bind -n M-L next-window

# New windows and split panes with current path preserved
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Configure status bar
set -g status-style bg='#16161e',fg='#565f89'

set -g status-left " "
set -g window-status-format "#{window_name}"
set -g window-status-current-format "#[fg=#c0caf5]#{window_name}"

set -g status-right "#[fg=#c0caf5]#{session_name} "

# Remove all pane borders (both active and inactive)
set -g pane-border-style fg=default,bg=default
set -g pane-active-border-style fg=default,bg=default

# Load vim-tmux-navigator plugin for better Vim/Neovim integration
run '~/.tmux/plugins/vim-tmux-navigator/vim-tmux-navigator.tmux'
